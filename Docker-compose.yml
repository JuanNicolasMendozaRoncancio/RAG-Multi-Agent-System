version: "3.9"

networks:
  rag_net:
    driver: bridge

services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - rag_net
    depends_on:
      nlp_worker:
        condition: service_started
      agent_worker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    networks:
      - rag_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nlp_worker:
    build:
      context: .
      dockerfile: nlp_worker/Dockerfile
    env_file:
      - .env
    networks:
      - rag_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m nlp_worker.pipeline' || exit 1"]
      interval: 600s
      timeout: 10s
      retries: 2

  agent_worker:
    build:
      context: .
      dockerfile: agent_worker/Dockerfile
    env_file:
      - .env
    networks:
      - rag_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m agent_worker.agents' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 2
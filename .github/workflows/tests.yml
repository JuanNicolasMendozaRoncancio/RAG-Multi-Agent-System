name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            shared/requirements.txt
            nlp_worker/requirements.txt
            agent_worker/requirements.txt
            api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r shared/requirements.txt
          pip install -r nlp_worker/requirements.txt
          pip install -r agent_worker/requirements.txt
          pip install pytest pytest-asyncio mongomock httpx python-dotenv

      - name: Download spaCy models
        run: |
          python -m spacy download es_core_news_md
          python -m spacy download en_core_web_md
          python -m spacy download fr_core_news_md

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}    
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pytest tests/test_integration.py tests/test_llm_client.py -v
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[project]
name = "rag-climate"
version = "0.1.0"
description = "Climate & Energy Intelligence System — multilingual RAG pipeline with multi-agent analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "motor==3.6.0",
    "pymongo==4.9.2",
    "python-dotenv>=1.0",
]
 

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "mongomock>=4.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
 
[tool.ruff]
line-length = 100
target-version = "py311"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
 
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
 
[[tool.mypy.overrides]]
module = ["spacy.*", "langdetect.*", "bertopic.*", "umap.*", "hdbscan.*", "pyvis.*"]
ignore_missing_imports = true
 
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]